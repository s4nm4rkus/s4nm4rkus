<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <path fill="#ffffff" fill-opacity="0.08">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,180 C300,220 900,140 1200,180 L1200,220 L0,220 Z;
        M0,190 C300,150 900,220 1200,170 L1200,220 L0,220 Z;
        M0,180 C300,220 900,140 1200,180 L1200,220 L0,220 Z" />
  </path>

  <text x="600" y="95" font-family="Verdana, Segoe UI, sans-serif" font-size="46"
        font-weight="bold" fill="#ffffff" text-anchor="middle">
    San Mark Morcoso
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <text x="600" y="135" font-family="Verdana, Segoe UI, sans-serif" font-size="18"
        fill="#e8e8ff" text-anchor="middle">
    Web &amp; Mobile Developer | Laravel • React Native • MERN
    <animate attributeName="opacity" from="0" to="1" dur="1.8s" fill="freeze"/>
  </text>
</svg>
